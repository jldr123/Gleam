<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Launch screen: the app's evening background with the sparkle, no text (Apple's guidance). -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaa25e" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#eaa25e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#eaa25e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffe2b0"/>
      <stop offset="0.55" stop-color="#f5b56a"/>
      <stop offset="1" stop-color="#e48b45"/>
    </linearGradient>
  </defs>
  <rect x="-2000" y="-2000" width="5000" height="5000" fill="#1a1410"/>
  <circle cx="500" cy="500" r="330" fill="url(#halo)"/>
  <path d="M500 410 C504 452 513 470 554 480 C513 490 504 508 500 550 C496 508 487 490 446 480 C487 470 496 452 500 410 Z" transform="translate(0 20)" fill="url(#spark)"/>
</svg>
